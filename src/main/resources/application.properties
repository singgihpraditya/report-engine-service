spring.application.name=report-engine-service

# Default active profile — override via -Dspring-boot.run.profiles=dev|prod
spring.profiles.active=local

# Server
server.port=8080
server.servlet.context-path=/

# Jackson - SNAKE_CASE & date format
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Jakarta
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging Aspect
app.logging.max-message-length=5000

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.app.name=${spring.application.name}
management.info.app.version=1.0.0

# JPA (non-profile-specific)
spring.jpa.show-sql=false

# Thymeleaf (disable default web resolver — only use string-based resolver)
spring.thymeleaf.check-template-location=false
