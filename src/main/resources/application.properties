spring.application.name=report-engine-service

# Server
server.port=8080
server.servlet.context-path=/

# Jackson - SNAKE_CASE & date format
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Jakarta
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging Aspect
app.logging.max-message-length=5000

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.app.name=${spring.application.name}
management.info.app.version=1.0.0

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/reportdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization — jalankan data.sql setiap startup (MERGE INTO = idempotent)
# defer-datasource-initialization memastikan tabel JPA sudah ada sebelum data.sql dieksekusi
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.defer-datasource-initialization=true

# Report Storage
app.report.storage.path=./reports

# Thymeleaf (disable default web resolver — only use string-based resolver)
spring.thymeleaf.check-template-location=false
