# ===== LOCAL PROFILE — H2 (embedded) =====

# Database
spring.datasource.url=jdbc:h2:file:./data/reportdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization — MERGE INTO = idempotent, dijalankan setiap startup
# defer-datasource-initialization memastikan tabel JPA sudah ada sebelum data.sql dieksekusi
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.defer-datasource-initialization=true

# Report Storage
app.report.storage.path=./reports

# Logging
logging.level.com.singgih=DEBUG
logging.level.org.springframework.web=INFO
logging.level.root=INFO
